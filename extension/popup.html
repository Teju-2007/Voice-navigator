<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Voice Navigator</title>
  <style>
    body {
      font-family: -apple-system, system-ui, sans-serif;
      width: 240px;
      padding: 16px;
      margin: 0;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    #startBtn {
      background: #4f46e5;
      color: white;
    }
    #stopBtn {
      background: #ef4444;
      color: white;
      display: none;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      color: #555;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }
    #status.error {
      color: #b91c1c;
    }
    #status.active {
      color: #166534;
    }
    #setupLink {
      display: block;
      margin-top: 12px;
      font-size: 11px;
      color: #4f46e5;
      text-align: center;
      cursor: pointer;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>🎙️ Voice Navigator</h1>
  <button id="startBtn">Start Listening</button>
  <button id="stopBtn">Stop Listening</button>
  <div id="status">Checking status…</div>
  <a id="setupLink">First time? Set up microphone access</a>
  <script src="popup.js"></script>
</body>
</html>
